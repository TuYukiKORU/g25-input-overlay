<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icons/app.ico') }}?v=20261002">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/app-icon-32.png') }}?v=20261002">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/app-icon-180.png') }}?v=20261002">
<link rel="manifest" href="{{ url_for('static', filename='app.webmanifest') }}?v=20261002">
<meta name="theme-color" content="#11161a">
